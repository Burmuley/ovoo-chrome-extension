<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ovoo - Anonymous Email Aliasing & Forwarding</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            width: 380px;
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 13px;
            margin: 0;
            padding: 0;
            color: #111827;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px 10px;
            border-bottom: 1px solid #e5e7eb;
        }

        .header-left h1 {
            font-size: 14px;
            font-weight: 600;
            margin: 0 0 2px;
        }

        .server-url {
            font-size: 11px;
            color: #9ca3af;
            word-break: break-all;
        }

        .header-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        button {
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            border: 1px solid #d1d5db;
            background: #f9fafb;
            font-family: inherit;
            white-space: nowrap;
        }

        button:hover:not(:disabled) {
            background: #f3f4f6;
        }

        button:disabled {
            opacity: 0.6;
            cursor: default;
        }

        .btn-logout {
            color: #dc2626;
            border-color: #fecaca;
        }

        .search-wrap {
            padding: 10px 14px;
            border-bottom: 1px solid #e5e7eb;
        }

        .search-wrap input {
            width: 100%;
            padding: 7px 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 13px;
            font-family: inherit;
            outline: none;
            background: #fff;
        }

        .search-wrap input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.15);
        }

        .alias-list {
            max-height: 320px;
            overflow-y: auto;
        }

        .alias-item {
            padding: 9px 14px;
            border-bottom: 1px solid #f3f4f6;
        }

        .alias-item:last-child {
            border-bottom: none;
        }

        .alias-email {
            font-size: 12px;
            font-weight: 500;
            color: #1f2937;
            word-break: break-all;
        }

        .alias-meta {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 3px;
        }

        .alias-service {
            font-size: 11px;
            color: #6b7280;
        }

        .alias-badge {
            font-size: 10px;
            padding: 1px 5px;
            border-radius: 9px;
            font-weight: 500;
        }

        .alias-badge.active {
            background: #d1fae5;
            color: #065f46;
        }

        .alias-badge.inactive {
            background: #f3f4f6;
            color: #9ca3af;
        }

        .empty-state {
            padding: 24px 14px;
            text-align: center;
            color: #9ca3af;
            font-size: 12px;
        }

        .simple-content {
            padding: 16px 14px;
        }

        .status {
            color: #6b7280;
            margin-bottom: 12px;
        }

        .providers {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .provider-btn {
            text-align: left;
            padding: 8px 12px;
            font-size: 13px;
        }

        a.link {
            color: #2563eb;
            cursor: pointer;
            font-size: 12px;
            text-decoration: underline;
        }

        .spinner-wrap {
            padding: 24px 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            color: #6b7280;
            font-size: 12px;
            text-align: center;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid #e5e7eb;
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .btn-new {
            color: #6366f1;
            border-color: #c7d2fe;
        }

        .btn-new:hover:not(:disabled) {
            background: #eef2ff;
        }

        .form-wrap {
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-label {
            font-size: 11px;
            font-weight: 500;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .form-input,
        .form-select {
            width: 100%;
            padding: 7px 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 13px;
            font-family: inherit;
            outline: none;
            background: #fff;
        }

        .form-input:focus,
        .form-select:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.15);
        }

        .btn-row {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            padding-top: 4px;
        }

        .btn-primary {
            background: #6366f1;
            color: #fff;
            border-color: #6366f1;
        }

        .btn-primary:hover:not(:disabled) {
            background: #4f46e5;
            border-color: #4f46e5;
        }

        .form-error {
            font-size: 12px;
            color: #dc2626;
        }

        .alias-result {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 6px;
            padding: 10px 12px;
            font-size: 13px;
            font-weight: 500;
            color: #166534;
            word-break: break-all;
        }
    </style>
</head>

<body>
    <div id="content"></div>
    <script type="module" src="popup.ts"></script>
</body>

</html>

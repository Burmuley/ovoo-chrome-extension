<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Ovoo Alias Helper — Options</title>
    <style>
      body {
        max-width: 480px;
        margin: 40px auto;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 14px;
        color: #111827;
        padding: 0 16px;
      }
      h1 {
        font-size: 18px;
        font-weight: 600;
      }
      label {
        display: block;
        margin-bottom: 4px;
        font-weight: 500;
      }
      input[type="url"] {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font-size: 14px;
        box-sizing: border-box;
      }
      input[type="url"]:focus {
        outline: 2px solid #2563eb;
        outline-offset: 1px;
        border-color: transparent;
      }
      .hint {
        font-size: 12px;
        color: #6b7280;
        margin-top: 4px;
      }
      button {
        margin-top: 14px;
        padding: 8px 18px;
        background: #2563eb;
        color: #ffffff;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        cursor: pointer;
        font-family: inherit;
      }
      button:hover {
        background: #1d4ed8;
      }
      #msg {
        margin-top: 10px;
        font-size: 13px;
      }
      #msg.success {
        color: #16a34a;
      }
      #msg.error {
        color: #dc2626;
      }
      textarea:focus {
        outline: 2px solid #2563eb;
        outline-offset: 1px;
        border-color: transparent;
      }
    </style>
  </head>
  <body>
    <h1>Ovoo Alias Helper — Options</h1>
    <label for="serverUrl">Ovoo Server URL</label>
    <input type="url" id="serverUrl" placeholder="https://ovoomail.example.com:8808" />
    <div class="hint">Include protocol and port. Changing this will sign you out.</div>
    <div style="margin-top: 18px;">
      <label style="font-weight:500; display:block; margin-bottom:6px;">Authentication mode</label>
      <label style="font-weight:400; display:flex; align-items:center; gap:6px; margin-bottom:4px;">
        <input type="radio" name="authMode" id="modeOidc" value="oidc" checked />
        OIDC (sign in with provider)
      </label>
      <label style="font-weight:400; display:flex; align-items:center; gap:6px;">
        <input type="radio" name="authMode" id="modeBearer" value="bearer" />
        Bearer token
      </label>
    </div>
    <div id="tokenSection" hidden style="margin-top: 14px;">
      <label for="bearerToken" style="font-weight:500; display:block; margin-bottom:4px;">Bearer Token</label>
      <textarea id="bearerToken" rows="4"
        placeholder="Paste your bearer token here…"
        style="width:100%;padding:8px 10px;border:1px solid #d1d5db;border-radius:6px;
               font-size:13px;font-family:monospace;box-sizing:border-box;resize:vertical;"></textarea>
      <div class="hint">Stored locally and sent as <code>Authorization: Bearer …</code>. Leave blank to keep the existing token.</div>
    </div>
    <button id="save">Save</button>
    <div id="msg" hidden></div>
    <script type="module" src="options.ts"></script>
  </body>
</html>
